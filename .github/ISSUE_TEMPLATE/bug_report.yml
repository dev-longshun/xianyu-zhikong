name: 使用问题
description: 请提供版本、系统和复现步骤，并先打码隐私信息。
title: "[问题] "
body:
  - type: input
    id: version
    attributes:
      label: 客户端版本
      placeholder: 例如 1.3.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 macOS 15 / Apple M2，或 Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 复现步骤与实际表现
      description: 请说明如何出现问题，以及你期望的结果。截图请先打码，勿公开 Cookie、密码、激活码或买家信息。
    validations:
      required: true
